<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>codeart-undead</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #e6edf3; font-family: ui-sans-serif, system-ui, "Noto Sans SC", sans-serif; }
  main { width: min(720px, 92vw); padding: 32px; border: 1px solid #1f2937; border-radius: 16px; background: linear-gradient(160deg, #111827, #0b0f14); }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: .5px; }
  p { margin: 6px 0; color: #9ca3af; font-size: 14px; }
  dl { display: grid; grid-template-columns: 120px 1fr; gap: 10px; margin: 24px 0 0; font-size: 14px; }
  dt { color: #6b7280; }
  dd { margin: 0; color: #e5e7eb; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #34d399; margin-right: 6px; box-shadow: 0 0 12px #34d399; }
</style>
</head>
<body>
<main>
  <h1><span class="dot"></span>sandbox alive</h1>
  <p>由 guard 定时任务保活的持久化沙箱演示页。</p>
  <dl>
    <dt>服务器时间</dt><dd id="server">-</dd>
    <dt>页面加载时间</dt><dd id="loaded">-</dd>
    <dt>时区</dt><dd id="tz">-</dd>
    <dt>UA</dt><dd id="ua">-</dd>
  </dl>
</main>
<script>
  const now = new Date();
  document.getElementById("server").textContent = new Intl.DateTimeFormat("zh-CN", { dateStyle: "full", timeStyle: "medium" }).format(now);
  document.getElementById("loaded").textContent = performance.timeOrigin ? new Date(performance.timeOrigin).toISOString() : now.toISOString();
  document.getElementById("tz").textContent = Intl.DateTimeFormat().resolvedOptions().timeZone + " (UTC" + (now.getTimezoneOffset() <= 0 ? "+" : "-") + Math.abs(now.getTimezoneOffset() / 60) + ")";
  document.getElementById("ua").textContent = navigator.userAgent;
</script>
</body>
</html>
